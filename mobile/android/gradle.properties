org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Several Flutter plugins (file_picker, package_info_plus, stripe_android)
# skip applying the Kotlin Gradle Plugin when they detect AGP 9, assuming the
# app enables AGP's built-in Kotlin support. With this false their Kotlin
# sources never compile and the build fails with "cannot find symbol" on the
# plugin class in GeneratedPluginRegistrant.java.
android.builtInKotlin=true
