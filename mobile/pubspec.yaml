name: bright_future_mobile
description: "Bright Future Digital Hub - ICT training, lab bookings and digital printing."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.2

  # State management
  provider: ^6.1.2

  # Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^11.0.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.0
  package_info_plus: ^10.2.1
  connectivity_plus: ^6.0.5

  # Security
  local_auth: ^2.3.0

  # File attachments for print orders
  file_picker: ^12.1.2

  # Push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # Payments
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# ── App launcher icons ──────────────────────────────────────────
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  adaptive_icon_background: "#533afd"
  adaptive_icon_foreground: "assets/images/logo.png"

# ── Native splash screen ────────────────────────────────────────
# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo.png
  color_dark: "#0d253d"
  image_dark: assets/images/logo.png
  android_12:
    image: assets/images/logo.png
    color: "#ffffff"
    icon_background_color: "#ffffff"
    image_dark: assets/images/logo.png
    color_dark: "#0d253d"
    icon_background_color_dark: "#0d253d"
  android: true
  ios: true
  web: false
