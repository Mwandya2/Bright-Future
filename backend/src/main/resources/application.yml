server:
  port: 8080

spring:
  application:
    name: bright-future-backend
  
  # Default datasource: H2 in-memory with PostgreSQL compatibility mode
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:brightfuture;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  # Flyway migrations are PostgreSQL-specific, and local development runs on
  # in-memory H2 that is thrown away on every restart, so Hibernate still
  # builds the dev schema. Production is Flyway + validate - see
  # application-prod.yml.
  flyway:
    enabled: false

  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:BrightFutureSuperSecretKeyForJWTSigningAndVerificationPurposeMustBe256BitsLong!}
    expiration-ms: 604800000 # 7 days
  admin:
    # The administrator's SIGN-IN identity. Only this address may use
    # /api/auth/admin-login, and it is the account DataInitializer creates.
    email: ${ADMIN_EMAIL:admin@brightfuture.best.com}
    default-password: ${ADMIN_PASSWORD:Admin@BrightFuture2026!}
    # Where administrator notifications are DELIVERED. Deliberately separate
    # from `email` above: the sign-in identity is a username on a domain that
    # may have no mailbox, so defaulting mail to it would silently lose it.
    notify-email: ${ADMIN_NOTIFY_EMAIL:mtoimnyama@gmail.com}
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:3001"
      - "https://brightfuture.best"

# ClickPesa mobile money (Tanzania). Values come from the environment - never
# commit the api key. Put them in backend/.env.local (gitignored) and load with:
#   set -a; source backend/.env.local; set +a
clickpesa:
  # Shared secret in the webhook URL path. Leave blank to reject every
  # callback - the endpoint fails closed.
  webhook-secret: ${CLICKPESA_WEBHOOK_SECRET:}
  base-url: ${CLICKPESA_BASE_URL:https://api.clickpesa.com/third-parties}
  client-id: ${CLICKPESA_CLIENT_ID:}
  api-key: ${CLICKPESA_API_KEY:}

# Springdoc OpenAPI Swagger documentation configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
